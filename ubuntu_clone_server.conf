# ubuntu_clone_server.conf
# Answers for ubuntu_clone_server.sh - usage: sudo bash ubuntu_clone_server.sh ubuntu_clone_server.conf
# Passwords are intentionally omitted - they are always prompted.
# Any line left out (or empty) is asked interactively. Delete the parts you do not need.
# The file is run as root: keep it owned by you or root and not writable by group/others.

# Source server (reached with an SSH key, no password)
SRC_HOST=192.0.2.10
SRC_PORT=22
SRC_USER=example
# SRC_KEY=/home/example/.ssh/id_ed25519     # unset = offer the sudo user's key; empty = root's own keys

# Web app (nginx + gunicorn)
CLONE_NGINX=y
# If nginx is installed but stopped: y = enable it at boot and start it (unset = ask)
#ENABLE_NGINX_SERVICE=y
SRC_DOMAIN=app.example.com
SRC_PATH=/home/example/app.example.com
SRC_SERVICE=/etc/systemd/system/app_example_com.service
SRC_NGINX=/etc/nginx/sites-available/app_example_com
WORKERS=2
TGT_DOMAIN=apptest.example.org
TGT_PATH=/home/example/apptest.example.org
# Top-level subdirectories of SRC_PATH to copy (space separated); all others are not copied
COPY_DIRS="daemons scripts server static utils"
# Create the directories that are not copied as empty directories on the target
CREATE_EMPTY_DIRS=y
START_SERVICE=y
# If the program the service starts is in a directory that is not copied (venv) and does not exist yet:
# y = build it here from server/requirements.txt (+ requirements_project.txt, constraints.txt if present)
#BUILD_VENV=y
# Python for that venv, e.g. 3.14 (must be installed). Empty = system python3. --python 3.14 overrides it.
#PYTHON_VERSION=3.14

# Let's Encrypt for the target domain
ISSUE_CERT=y
LE_EMAIL=admin@example.org
LE_STAGING=n

# MySQL schema (passwords prompted)
CLONE_MYSQL=y
# If MySQL/MariaDB is installed but stopped: y = enable it at boot and start it (unset = ask)
#ENABLE_DB_SERVICE=y
SRC_DB_SCHEMA=app
SRC_DB_USER=app
TGT_DB_SCHEMA=apptest
TGT_DB_USER=apptest

# Cron jobs (each job is still confirmed one by one)
CLONE_CRON=y
SRC_CRON_USER=example
TGT_CRON_USER=example

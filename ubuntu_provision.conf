# ubuntu_provision.conf
# Passwords intentionally omitted - will be prompted

# Package versions
PG_VERSION=18
PYPY_FALLBACK_VERSION=pypy3.11-v8.0.1
FORGEJO_FALLBACK_VERSION=17.0.0
MODULEJAIL_FALLBACK_VERSION=1.6.3
FORGEJO_FALLBACK_PORT=3030

# User
USER_CREATE_SUDO_USER=y
USER_USE_CURRENT_USERNAME=n
USER_SUDO_USER_USERNAME=example

# System
CONFIGURE_LVM=y
LVM_RESIZE_VOLUME=y
LVM_RESIZE_TARGET_GB=all
CONFIGURE_SWAP=y
SWAP_SIZE_GB=2
TUNE_SYSTEM=y
AUTO_UPDATE_DAILY_HOUR=9
AUTO_UPGRADE_DAILY_HOUR=10
DISABLE_TX_OFFLOAD=n
CONFIGURE_APPARMOR=y
CONFIGURE_MODULEJAIL=y
APPARMOR_ENABLE=y
APPARMOR_ENFORCE=y

# Packages
UNINSTALL_PACKAGES=y
UPDATE_PACKAGES=y
INSTALL_PACKAGES=y

# Services
INSTALL_UFW=y
INSTALL_SSH=y
INSTALL_FONTS=y
INSTALL_WEASYPRINT=y
INSTALL_IMAGEMAGICK=y
INSTALL_CPYTHON314=y
INSTALL_PYPY311=y
INSTALL_NGINX=y
INSTALL_VALKEY=y
INSTALL_MYSQL=y
INSTALL_MARIADB=n
INSTALL_POSTGRESQL=y
INSTALL_MOSQUITTO=y
INSTALL_POSTFIX=y
INSTALL_MONIT=y
INSTALL_WEBMIN=y
INSTALL_GRAFANA=y
INSTALL_FORGEJO=y
INSTALL_FAIL2BAN=y
INSTALL_AUDITD=y
INSTALL_IPBLOCK=y
INSTALL_SURICATA=y
INSTALL_WAZUH=y

# Fonts tuning
INSTALL_MS_FONTS=y

# MySQL tuning - leave blank to use auto-calculated defaults based on available memory
MYSQL_BUFFER_POOL_MB=
MYSQL_BUFFER_POOL_INSTANCES=
MYSQL_BUFFER_POOL_CHUNK_MB=128
MYSQL_MAX_CONNECTIONS=100
MYSQL_LOG_BUFFER_MB=64
MYSQL_BINLOG_CACHE_MB=16
MYSQL_JOIN_BUFFER_KB=512
MYSQL_SORT_BUFFER_KB=512
MYSQL_READ_BUFFER_KB=128
MYSQL_READ_RND_BUFFER_KB=1024
# Passwords intentionally omitted - will always be prompted:
# MYSQL_PASSWORD=
# MYSQL_PASSWORD_CONFIRM=

# PostgreSQL tuning - leave blank to use auto-calculated defaults based on available memory
PG_MAX_CONNECTIONS=100
PG_SHARED_BUFFERS_MB=
PG_WORK_MEM_MB=
PG_EFFECTIVE_CACHE_MB=
PG_MAX_WORKER_PROCESSES=
PG_MAX_PARALLEL_WORKERS=
PG_MAX_PARALLEL_WORKERS_PG=
PG_EFFECTIVE_IO_CONCURRENCY=100
# Password intentionally omitted - will always be prompted:
# PG_PASSWORD=

# Valkey password (requirepass) intentionally omitted - will always be prompted when Valkey is installed:
# VALKEY_PASSWORD=

# Postfix relay-only SMTP
POSTFIX_RELAY_HOST=smtp.example.com
POSTFIX_RELAY_PORT=587
POSTFIX_RELAY_USERNAME=user@example.com
POSTFIX_DOMAIN=example.com
POSTFIX_FROM_ADDRESS=root@example.com
POSTFIX_ROOT_ALIAS=admin@example.com
# Password intentionally omitted - will always be prompted:
# POSTFIX_RELAY_PASSWORD=

# Monit
MONIT_USE_POSTFIX=y
MONIT_MAILSERVER_HOST=smtp.example.com
MONIT_MAILSERVER_PORT=587
MONIT_MAILSERVER_USERNAME=monit@example.com
MONIT_ALERT_SENDER=monit@example.com
MONIT_ALERT_RECIPIENT=admin@example.com
MONIT_ADMIN_USERNAME=admin
# Passwords intentionally omitted - will always be prompted:
# MONIT_MAILSERVER_PASSWORD=
# MONIT_ADMIN_PASSWORD=

# Grafana
GRAFANA_USE_POSTFIX=y
GRAFANA_SMTP_ENABLED=true
GRAFANA_SMTP_HOST=smtp.example.com
GRAFANA_SMTP_PORT=587
GRAFANA_SMTP_USER=grafana@example.com
GRAFANA_SMTP_FROM_ADDRESS=grafana@example.com
GRAFANA_SMTP_FROM_NAME=Grafana
GRAFANA_SMTP_EHLO_IDENTITY=example.com
GRAFANA_SMTP_STARTTLS_POLICY=MandatoryStartTLS
# Password intentionally omitted - will always be prompted:
# GRAFANA_SMTP_PASSWORD=

# Forgejo
FORGEJO_DOMAIN=example.com
FORGEJO_PORT=3000
FORGEJO_FALLBACK_PORT=3030
FORGEJO_USE_POSTFIX=y
FORGEJO_MAILER_ENABLED=true
FORGEJO_SMTP_ADDR=smtp.example.com
FORGEJO_SMTP_PORT=587
FORGEJO_SMTP_PROTOCOL=smtps
FORGEJO_SMTP_FROM=forgejo@example.com
FORGEJO_SMTP_USER=forgejo@example.com
FORGEJO_DB_TYPE=sqlite3
FORGEJO_DB_NAME=forgejo
FORGEJO_DB_USER=forgejo
FORGEJO_DB_HOST=
FORGEJO_ADMIN_USERNAME=
FORGEJO_ADMIN_EMAIL=admin@example.com
# Passwords intentionally omitted - will always be prompted:
# FORGEJO_SMTP_PASSWORD=
# FORGEJO_DB_PASSWORD=
# FORGEJO_ADMIN_PASSWORD=

# Hold services against automatic upgrades (you upgrade them by hand: sudo upgrade-held-packages).
# Held packages are also skipped for security fixes, so a mail is sent when an update is waiting.
# HOLD_NGINX=y
# HOLD_VALKEY=y
# HOLD_MYSQL=y          # or HOLD_MARIADB
# HOLD_POSTGRESQL=y
# HOLD_GRAFANA=y
# HELD_UPDATE_MAIL_TO=admin@example.com
# HELD_UPDATE_REMINDER_DAYS=7   # repeat while pending; 0 = only when a new version appears

# Wazuh agent
WAZUH_MANAGER=wazuh.example.com

# Wazuh Server (manager + indexer + dashboard on this host). Needs ~8 GB RAM; off by default.
# INSTALL_WAZUHMANAGER=y
# WAZUH_SERVER_VERSION=4.14           # release stream of the installer; 4.14.9 is accepted too
# WAZUH_DASHBOARD_PORT=443            # use another port (e.g. 5601) when nginx is on the same host
# WAZUH_SERVER_HOLD_PACKAGES=y        # apt-mark hold so unattended upgrades cannot break the server
# WAZUH_OPEN_AGENT_PORTS=n            # y = UFW allow 1514/1515 tcp for remote agents
# WAZUH_AGENT_ALLOW_FROM=10.0.0.0/24  # optional source restriction for those UFW rules; empty = anywhere
# WAZUH_INDEXER_HEAP_MB=auto          # 'auto' = half of RAM (max 31744), or a number of MB
# WAZUH_ALERTS_SHARDS=1               # primary shards per NEW daily wazuh-alerts index
# WAZUH_ALERTS_RETENTION_DAYS=90      # ISM policy deletes alert indices after N days (0 = keep forever)
# WAZUH_SERVER_ALLOW_LOW_RAM=n        # must be y to install on a host with < 7 GB RAM
# WAZUH_SERVER_ALLOW_UNSUPPORTED_OS=n # must be y on Ubuntu 26.04 (Wazuh supports up to 24.04)
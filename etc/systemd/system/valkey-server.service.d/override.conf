# Drop-in for the packaged unit. Installed by ubuntu_provision.sh.
# Keeps /etc/valkey read-only for valkey itself, so a client with the password cannot use
# CONFIG SET dir / CONFIG REWRITE to change valkey.conf or valkey-auth.conf.
# ProtectSystem=strict makes everything read-only; the list below re-allows only the data,
# log and runtime folders ("-" = skip if missing). Reset first (empty line) so a packaged
# ReadWritePaths=/etc/valkey is dropped.
[Service]
ProtectSystem=strict
ReadWritePaths=
ReadWritePaths=-/var/lib/valkey
ReadWritePaths=-/var/log/valkey
ReadWritePaths=-/run/valkey
ReadWritePaths=-/var/run/valkey
